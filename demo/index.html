<style>
.req { color: #dc2626; font-weight: 800; }
.form-errors {
  background: #fef2f2;
  border: 1.5px solid #dc2626;
  color: #7f1d1d;
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 12px;
  font-size: 13px;
}
.form-errors strong { display: block; margin-bottom: 6px; font-size: 14px; }
.form-errors ul { margin: 0; padding-left: 18px; }
.form-errors li { margin: 3px 0; }
.field.invalid input {
  border-color: #dc2626;
  box-shadow: 0 0 0 3px rgba(220, 38, 38, .15);
  background: #fff7f7;
}
.item.invalid {
  outline: 2px solid #fca5a5;
  background: #fff7f7;
  border-radius: 10px;
  padding: 6px 8px;
}
.sigpad-wrap.invalid .sigpad {
  box-shadow: 0 0 0 3px rgba(220, 38, 38, .35);
}
.sig-stamp { font-size: 11px; color: #64748b; margin-top: 6px; }
input[type='time'] {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  font-size: 15px;
  background: #fff;
  color: #0f172a;
  font-family: inherit;
}
.compliance-note { font-size: 12px; color: #64748b; margin: 0 0 10px; }
</style>
</head>

<div id="hub" class="hub">

    <div>

      <p>Reviews &middot; Training &middot; Certs &middot; Routes</p>

  </div>
</header>
